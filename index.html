<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scale intake</title>
<style>
body{margin:0;background:#15181c;color:#e8ece9;font:16px system-ui,sans-serif}
#wrap{position:relative}video{width:100%;display:block}
#box{position:absolute;border:2px solid #3ddc84;pointer-events:none;display:none}
#s{padding:12px 12px 4px;font-weight:600;font-size:18px}
#a{padding:0 12px;color:#ff8a80;font-weight:700}
#u{padding:0 12px 6px;font:12px ui-monospace,monospace;color:#7d8a82;word-break:break-all}
#dbg{padding:4px 12px;font:12px ui-monospace,monospace;color:#7d8a82}
.row{padding:4px 12px 10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,select{padding:10px 14px;font-size:15px}
#zw{display:none}
#log div{padding:3px 12px;font:13px ui-monospace,monospace;color:#9fc9ad}
</style></head><body>
<div id="wrap"><video id="v" playsinline muted></video><div id="box"></div></div>
<div id="s">Starting...</div><div id="a"></div><div id="dbg"></div><div id="u"></div>
<div class="row">
<button id="b">Set display box</button><button id="t">Test connection</button><button id="c">Reset settings</button>
<select id="res"><option value="1080">1080p</option><option value="1440">1440p</option><option value="2160">4K</option></select>
<label id="zw">Zoom <input id="z" type="range"></label>
</div>
<div id="log"></div>
<script>
const $=id=>document.getElementById(id),v=$('v'),S=$('s');
let EP=(localStorage.ep||'').trim(),SECRET=(localStorage.secret||'').trim(),pts=null,track=null,aT;
let ROI=JSON.parse(localStorage.roi||'null');            // display box, stored as fractions of the frame
if(ROI&&(ROI.x>1||ROI.w>1)){ROI=null;localStorage.removeItem('roi');} // drop boxes saved by the older version
if(!EP||!SECRET){EP=(prompt('Apps Script web app URL')||'').trim();SECRET=(prompt('Secret word')||'').trim();localStorage.ep=EP;localStorage.secret=SECRET;}
const URL_OK=/^https:\/\/script\.google\.com\/(a\/macros\/[^\/]+|macros)\/s\/[^\/\s]+\/exec$/.test(EP);
$('u').textContent='Script URL saved: '+EP.slice(0,36)+'...'+EP.slice(-10)+' ('+EP.length+' characters)'+(URL_OK?'':' - NOT a valid web app URL: it must start with https://script.google.com/macros/s/ and end with /exec');

// tunable: STILL = how steady the display must look (lower = stricter); MIN_MS/MAX_MS = shortest and longest wait before sending
const STILL=0.12,TICK_MS=200,MIN_MS=1600,MAX_MS=5000;
const RES={1080:[1920,1080],1440:[2560,1440],2160:[3840,2160]};

/* ---------- sounds: rising chime = good, low double buzz = problem ---------- */
let AC;['click','touchend'].forEach(ev=>document.addEventListener(ev,()=>{AC=AC||new AudioContext();AC.resume();}));
function tone(f,ms,type,when){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=.25;
 o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+when);o.stop(AC.currentTime+when+ms/1000);}
const good=()=>{tone(880,120,'sine',0);tone(1320,200,'sine',.14);};
const bad=()=>{tone(220,260,'square',0);tone(170,380,'square',.32);};

/* ---------- tracking numbers from barcodes and QR codes ---------- */
function fix(x){return(/^\d{30,34}$/.test(x)&&x.startsWith('420'))?x.slice(-22):x;}
function extract(raw){const out=[],s=raw.replace(/[\s()]/g,'').toUpperCase();
 if(/^(1Z[0-9A-Z]{16}|TBA\d{9,}|\d{12,34})$/.test(s))out.push(fix(s));
 else for(const m of raw.toUpperCase().matchAll(/1Z[0-9A-Z]{16}|TBA\d{9,}|\d{12,34}/g))out.push(fix(m[0]));
 return out;}

/* ---------- image helpers ---------- */
const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
function jpeg(sx,sy,sw,sh,w){const k=w/sw;cv.width=w;cv.height=Math.round(sh*k);
 cx.drawImage(v,sx,sy,sw,sh,0,0,cv.width,cv.height);return cv.toDataURL('image/jpeg',.8).split(',')[1];}
const vw=()=>v.videoWidth,vh=()=>v.videoHeight;
const crop=()=>jpeg(ROI.x*vw(),ROI.y*vh(),ROI.w*vw(),ROI.h*vh(),400);
function sig(){const w=48,h=16;cv.width=w;cv.height=h;
 cx.drawImage(v,ROI.x*vw(),ROI.y*vh(),ROI.w*vw(),ROI.h*vh(),0,0,w,h);
 const d=cx.getImageData(0,0,w,h).data,o=[];let m=0;
 for(let i=0;i<d.length;i+=4){const g=(d[i]+d[i+1]+d[i+2])/3;o.push(g);m+=g;}
 m/=o.length;let s=0;for(const g of o)s+=(g-m)**2;s=Math.sqrt(s/o.length)||1;
 return o.map(g=>(g-m)/s);}                                  // normalised, so lighting changes do not count as movement
function diff(a,b){let s=0;for(let i=0;i<a.length;i++)s+=Math.abs(a[i]-b[i]);return s/a.length;}

/* ---------- camera, zoom, display box ---------- */
async function cam(){
 if(v.srcObject)v.srcObject.getTracks().forEach(t=>t.stop());
 const[w,h]=RES[localStorage.res||'1080'];
 v.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:w},height:{ideal:h}}});
 await v.play();track=v.srcObject.getVideoTracks()[0];
 const caps=track.getCapabilities?track.getCapabilities():{};
 if(caps.focusMode&&caps.focusMode.includes('continuous'))track.applyConstraints({advanced:[{focusMode:'continuous'}]}).catch(()=>{});
 if(caps.zoom){const z=$('z');z.min=caps.zoom.min;z.max=caps.zoom.max;z.step=caps.zoom.step||.1;z.value=localStorage.zoom||caps.zoom.min;
  track.applyConstraints({advanced:[{zoom:+z.value}]}).catch(()=>{});$('zw').style.display='inline';}
}
$('res').value=localStorage.res||'1080';
$('res').onchange=async()=>{localStorage.res=$('res').value;await cam();drawBox();};
$('z').onchange=()=>{localStorage.zoom=$('z').value;track.applyConstraints({advanced:[{zoom:+$('z').value}]}).catch(()=>{});
 ROI=null;localStorage.removeItem('roi');drawBox();};      // zoom moves the picture, so the display box must be set again
function drawBox(){const b=$('box');if(!ROI){b.style.display='none';return;}
 const r=v.getBoundingClientRect();b.style.display='block';
 b.style.left=ROI.x*r.width+'px';b.style.top=ROI.y*r.height+'px';b.style.width=ROI.w*r.width+'px';b.style.height=ROI.h*r.height+'px';}
$('b').onclick=()=>{pts=[];ROI=null;drawBox();S.textContent='Tap top-left, then bottom-right of the scale display';};
$('c').onclick=()=>{localStorage.clear();location.reload();};
v.onclick=e=>{if(!pts)return;const r=v.getBoundingClientRect();
 pts.push([(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]);
 if(pts.length==2){const[[x1,y1],[x2,y2]]=pts;
  const n={x:Math.min(x1,x2),y:Math.min(y1,y2),w:Math.abs(x2-x1),h:Math.abs(y2-y1)};pts=null;
  if(n.w<.01||n.h<.01){S.textContent='Box too small - tap "Set display box" and try again';return;}
  ROI=n;localStorage.roi=JSON.stringify(ROI);drawBox();}};

/* ---------- sending and results ---------- */
const seen=new Set();
function show(codes,r){const d=document.createElement('div'),id=codes[0].slice(-8);
 d.textContent=id+'  '+(r.group||r.client||r.label_name||'?')+'  '+(r.weight??'?')+'  '+(r.status||r.error||'');
 $('log').prepend(d);
 if(r.status==='OK'){good();return;}
 d.style.color='#ff8a80';
 $('a').textContent='CHECK '+id+': '+(r.error||r.note||r.status);
 bad();clearTimeout(aT);aT=setTimeout(()=>$('a').textContent='',20000);}
function send(codes,label,snaps){const body=JSON.stringify({secret:SECRET,codes,label,snaps});codes.forEach(c=>seen.add(c));
 (async function go(n){try{const r=await(await fetch(EP,{method:'POST',body})).json();if(r.error)codes.forEach(c=>seen.delete(c));show(codes,r);}
 catch(e){if(n<3)setTimeout(()=>go(n+1),3000);else{codes.forEach(c=>seen.delete(c));show(codes,{error:'SEND FAILED ('+e.message+') - scan it again'});}}})(0);}
// one-tap check that the page can reach your Google script and the secret matches
$('t').onclick=async()=>{const a=$('a');a.textContent='Testing...';
 if(!URL_OK){a.textContent='The saved URL is not a web app URL (see the grey line below). Tap Reset settings and paste the /exec URL';bad();return;}
 try{const r=await(await fetch(EP,{method:'POST',body:JSON.stringify({secret:SECRET,ping:true})})).json();
  if(r.error){a.textContent='Script reached, but: '+r.error;bad();}else{a.textContent='Connected OK - URL and secret are correct';good();}}
 catch(e){let m;
  try{await fetch(EP,{mode:'no-cors'});m='Google answered but would not share the reply: access is not set to Anyone, or this is not the right deployment URL';}
  catch(_){m='Cannot reach script.google.com at all: check the URL spelling, the connection, VPN or ad blocker';}
  a.textContent=m+' ('+e.message+')';bad();}
 clearTimeout(aT);aT=setTimeout(()=>a.textContent='',30000);};

/* ---------- main loop: a new tracking barcode starts a package; no buttons needed ---------- */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function main(){
 if(!('BarcodeDetector' in window)){S.textContent='Use Chrome on Android (no barcode support here)';return;}
 await cam();try{await navigator.wakeLock.request('screen');}catch{}
 const det=new BarcodeDetector();drawBox();
 let st='idle',prev=null,still=0,codes=new Set(),label=null,since=0,snaps=[],lastSnap=0;
 while(true){
  await sleep(TICK_MS);
  if(!ROI){S.textContent='Tap "Set display box" first';prev=null;continue;}
  const cur=sig();let found=[],raws=[];
  try{for(const b of await det.detect(v)){raws.push(b.rawValue);extract(b.rawValue).forEach(t=>found.push(t));}}catch{}
  const fresh=found.filter(t=>!seen.has(t));
  const d=prev?diff(cur,prev):0;prev=cur;
  $('dbg').textContent='display movement '+d.toFixed(2)+' (steady when under '+STILL+')';
  if(st=='idle'){
   if(fresh.length){st='weigh';since=Date.now();still=0;snaps=[];lastSnap=0;codes=new Set(fresh);label=jpeg(0,0,vw(),vh(),1280);}
   else S.textContent=found.length?'Already scanned: '+found[0]:raws.length?'Barcode seen but not a tracking number: '+raws[0].slice(0,30):'Ready';
  }else{
   fresh.forEach(t=>codes.add(t));
   if(fresh.length)label=jpeg(0,0,vw(),vh(),1280);          // keep the newest sharp frame of the label
   if(Date.now()-lastSnap>=400){snaps.push(crop());snaps=snaps.slice(-3);lastSnap=Date.now();}
   still=d<STILL?still+1:0;
   const t=Date.now()-since;
   S.textContent='Weighing '+[...codes].map(c=>c.slice(-8)).join(' . ');
   if((t>=MIN_MS&&still>=3)||t>=MAX_MS){send([...codes],label,snaps);st='idle';S.textContent='Sent - next package';}
  }
 }
}
main().catch(e=>S.textContent='Error: '+e.message);
</script></body></html>
